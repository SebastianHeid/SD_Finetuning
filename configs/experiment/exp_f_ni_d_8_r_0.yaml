# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000
trainer:
  max_epochs: 5
task_name: exp_f_ni_d_8_r_0
model:
  
  unet:
    custome_unet_flag: True
    final_loss_flag: True
    
    # feature loss
    intermediate_res_loss_flag: False
    intermediate_res_loss_stage: []
    intermediate_res_loss_block: []

    # blocks to remove
    down_res_stage: [] # 0-3
    down_res_block: [] # 0-1
    down_att_stage: [] # 0-2
    down_att_block: [] # 0-1

    
    mid_res_block: [] # 0-1
    mid_att_block: [] # 0

    up_res_stage: [3] # 0-3
    up_res_block: [0] # 0-2
    up_att_stage: [] # 1-3
    up_att_block: [] # 0-2
    
    # trainable blocks
    down_res_stage_train: [] # 0-3
    down_res_block_train: [] # 0-1
    down_att_stage_train: [] # 0-2
    down_att_block_train: [] # 0-1

    mid_res_block_train: [] # 0-1
    mid_att_block_train: [] #

    up_res_stage_train: [2,3] # 0-3
    up_res_block_train: [2,0] # 0-2
    up_att_stage_train: [] # 1-3
    up_att_block_train: [] # 0-2


  ref_unet:
    custome_unet_flag: True