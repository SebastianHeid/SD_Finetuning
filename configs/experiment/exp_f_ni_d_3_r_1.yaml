callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000

task_name: exp_f_ni_d_3_r_1
model:
  unet:
    custome_unet_flag: True
    remove_downsample_blocks: [3] 
    remove_resnet_blocks: [1]
