# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 10
data:
  batch_size: 1 #
task_name: exp_test
model:
  unet:
    custome_unet_flag: True
    org_loss_flag: True
    final_dis_flag: True
    
    # feature loss
    feature_loss_normalization_flag: True
    intermediate_res_loss_flag: True
    intermediate_res_loss_stage: [4,3] # 0-8: 0-3: down stage, 4: mid stage, 5-8: up stage
    intermediate_res_loss_block: [0,1]

    intermediate_attn_loss_flag: False
    intermediate_attn_loss_stage: [8] # 0-8: 0-3: down stage, 4: mid stage, 5-8: up stage
    intermediate_attn_loss_block: [0]

    # blocks to remove
    down_res_stage: [] # 0-3
    down_res_block: [] # 0-1
    down_att_stage: [] # 0-2
    down_att_block: [] # 0-1

    
    mid_res_block: [] # 0-1
    mid_att_block: [] # 0

    up_res_stage: [0] # 0-3
    up_res_block: [1] # 0-2
    up_att_stage: [] # 1-3
    up_att_block: [] # 0-2
    
    # trainable blocks
    down_res_stage_train: [1] # 0-3
    down_res_block_train: [1] # 0-1
    down_att_stage_train: [] # 0-2
    down_att_block_train: [] # 0-1

    mid_res_block_train: [] # 0-1
    mid_att_block_train: [] #

    up_res_stage_train: [] # 0-3
    up_res_block_train: [] # 0-2
    up_att_stage_train: [1] # 1-3
    up_att_block_train: [0] # 0-2


  