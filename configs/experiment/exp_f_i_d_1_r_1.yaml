# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000

trainer:
  max_epochs: 4
task_name: exp_f_i_d_1_r_1
model:
  
  unet:
    ckpt_path: "/export/data/sheid/diffusion_training/exp_f_i_d_1_r_1/runs/2025-04-24_10-31-38/checkpoints/epoch_epoch=000_model/diffusion_pytorch_model.safetensors"
    custome_unet_flag: True
    final_loss_flag: True
    
    # feature loss
    intermediate_res_loss_flag: True
    intermediate_res_loss_stage: [1]
    intermediate_res_loss_block: [1]

    # blocks to remove
    down_res_stage: [1] # 0-3
    down_res_block: [1] # 0-1
    down_att_stage: [] # 0-2
    down_att_block: [] # 0-1

    
    mid_res_block: [] # 0-1
    mid_att_block: [] # 0

    up_res_stage: [] # 0-3
    up_res_block: [] # 0-2
    up_att_stage: [] # 1-3
    up_att_block: [] # 0-2
    
    # trainable blocks
    down_res_stage_train: [1,1] # 0-3
    down_res_block_train: [0,1] # 0-1
    down_att_stage_train: [] # 0-2
    down_att_block_train: [] # 0-1

    mid_res_block_train: [] # 0-1
    mid_att_block_train: [] #

    up_res_stage_train: [] # 0-3
    up_res_block_train: [] # 0-2
    up_att_stage_train: [] # 1-3
    up_att_block_train: [] # 0-2


  ref_unet:
    custome_unet_flag: True