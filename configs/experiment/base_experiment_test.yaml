# @package _global_
seed: 100
task_name: experiment_test

callbacks:
  model_checkpoint:
    every_n_train_steps: 10
  image_logger:
    sampling_freq: 10
    num_batches: 3
    sampling_batch_size: 3
    cond: false
    uncond: false
    cfg: true
  eval_callback:
    eval_freq: 10
    eval_cmmd: true
    eval_fid: false
    eval_kid: false
    cond: false
    uncond: false
    cfg: true
    num_images: 4
    delete_samples: false
  test_callback:
    eval_cmmd: true
    eval_fid: true
    eval_kid: true
    cond: false
    uncond: false
    cfg: true

data:
  batch_size: 2 #
  gradient_accumulation: 2 #

  persistent_workers: false
  pin_memory: false
  num_workers: 0 #

  num_val: 100 #
  num_stable_train: 100 #

logger:
  wandb:
    project: test

trainer:
  max_epochs: 20 #
  reload_dataloaders_every_n_epochs: 9999999
  val_check_interval: 0.5 #
  devices: 2

model:
  model_name: stabilityai/stable-diffusion-2-1-base #
  loss_type: mse
  prediction_type: epsilon #
  zero_snr: false
  snr_gamma: null
  latent_dataset: True

# customed unet
  unet:
    custome_unet_flag: True
    config_json: "/export/home/sheid/SD_Finetuning/dmt/models/diffusion/customized_unet/json/SD_DownBlocks.json"
    remove_downsample_blocks: [1] 
    remove_resnet_blocks: [1]
# ------------------------------

  gradient_checkpointing: true



  optimizer:
    lr: 2e-6


  scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    total_iters: ${trainer.max_epochs}