# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000
trainer:
  max_epochs: 5
  devices: 2
data:
  batch_size: 8 #
task_name: exp_nf_i_d_1_2_r_1_1
model:
  
  unet:
    custome_unet_flag: True
    org_loss_flag: False
    final_dis_flag: False
    
    # feature loss
    intermediate_res_loss_flag: True
    intermediate_res_loss_stage: [1,2] # 0-8: 0-3: down stage, 4: mid stage, 5-8: up stage
    intermediate_res_loss_block: [1,1]

    # blocks to remove
    down_res_stage: [1,2] # 0-3
    down_res_block: [1,1] # 0-1
    down_att_stage: [] # 0-2
    down_att_block: [] # 0-1

    
    mid_res_block: [] # 0-1
    mid_att_block: [] # 0

    up_res_stage: [] # 0-3
    up_res_block: [] # 0-2
    up_att_stage: [] # 1-3
    up_att_block: [] # 0-2
    
    # trainable blocks
    down_res_stage_train: [1,2] # 0-3
    down_res_block_train: [0,0] # 0-1
    down_att_stage_train: [] # 0-2
    down_att_block_train: [] # 0-1

    mid_res_block_train: [] # 0-1
    mid_att_block_train: [] #

    up_res_stage_train: [] # 0-3
    up_res_block_train: [s] # 0-2
    up_att_stage_train: [] # 1-3
    up_att_block_train: [] # 0-2


  ref_unet:
    custome_unet_flag: True