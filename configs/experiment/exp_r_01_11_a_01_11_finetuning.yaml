# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000
trainer:
  max_epochs: 5
task_name: exp_r_01_11_a_01_11_finetuning
model:
  optimizer:
    lr: 2e-6
  unet:
    ckpt_path: "/export/data/sheid/diffusion_training/exp_r_01_11_a_01_11/runs/2025-05-08_08-26-11/checkpoints/epoch_epoch=009_model/diffusion_pytorch_model.safetensors"
    custome_unet_flag: True
    org_loss_flag: True
    final_dis_flag: True
    
    # feature loss
    feature_loss_normalization_flag: True
    block_loss_flag: False
    block_loss_stages: [] # 0-9
    # feature loss
    intermediate_res_loss_flag: False
    intermediate_res_loss_stage: [] # 0-8: 0-3: down stage, 4: mid stage, 5-8: up stage
    intermediate_res_loss_block: []

    intermediate_attn_loss_flag: True # just take the loss after the attention block because we removed res+att pair
    intermediate_attn_loss_stage: [0,1] # 0-8: 0-3: down stage, 4: mid stage, 5-8: up stage
    intermediate_attn_loss_block: [1,1]


    # blocks to remove
    down_res_stage: [0,1] # 0-3
    down_res_block: [1,1] # 0-1
    down_att_stage: [0,1] # 0-2
    down_att_block: [1,1] # 0-1

    
    mid_res_block: [] # 0-1
    mid_att_block: [] # 0

    up_res_stage: [] # 0-3
    up_res_block: [] # 0-2
    up_att_stage: [] # 1-3
    up_att_block: [] # 0-2
    
    # trainable blocks
    all_blocks_trainable: True
    down_res_stage_train: [] # 0-3
    down_res_block_train: [] # 0-1
    down_att_stage_train: [] # 0-2
    down_att_block_train: [] # 0-1

    mid_res_block_train: [] # 0-1
    mid_att_block_train: [] #

    up_res_stage_train: [] # 0-3
    up_res_block_train: [] # 0-2
    up_att_stage_train: [] # 1-3
    up_att_block_train: [] # 0-2


  ref_unet:
    custome_unet_flag: True