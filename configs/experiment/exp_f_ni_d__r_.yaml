# @package _global_
seed: 100
task_name: exp_f_ni_d__r_

callbacks:
  model_checkpoint:
    every_n_train_steps: 10000
  image_logger:
    sampling_freq: 10000
    num_batches: 3
    sampling_batch_size: 3
    cond: false
    uncond: false
    cfg: true
  eval_callback:
    eval_freq: 10000
    eval_cmmd: true
    eval_fid: false
    eval_kid: false
    cond: false
    uncond: false
    cfg: true
    num_images: 4
    delete_samples: false
  test_callback:
    eval_cmmd: true
    eval_fid: true
    eval_kid: true
    cond: false
    uncond: false
    cfg: true

data:
  batch_size: 12 #
  gradient_accumulation: 1 #

  persistent_workers: false
  pin_memory: false
  num_workers: 16 #

  num_val: 100 #
  num_stable_train: 100 #

logger:
  wandb:
    project: dm-finetuning
    name: ${task_name}

trainer:
  max_epochs: 20 #
  reload_dataloaders_every_n_epochs: 9999999
  val_check_interval: 0.1 #
  devices: 1

model:
  model_name: stabilityai/stable-diffusion-2-1-base #
  loss_type: mse
  prediction_type: epsilon #
  zero_snr: false
  snr_gamma: null
  latent_dataset: True
  unet:
    custome_unet_flag: True
    config_json: "/export/home/sheid/SD_Finetuning/dmt/models/diffusion/customized_unet/json/SD_DownBlocks.json"
    remove_downsample_blocks: [] 
    remove_resnet_blocks: []
    loss_intermediate_output_flag: False 
    loss_final_output_flag: True
  

  gradient_checkpointing: true


  optimizer:
    lr: 2e-5 # Learning rate

  scheduler: # Define the learning rate scheduler to use
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs} # Same value as set above for trainer
    eta_min: 0.0
    last_epoch: -1

