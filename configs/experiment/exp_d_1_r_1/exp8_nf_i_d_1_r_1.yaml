# @package _global_
defaults:
  - base_experiment

# Every variable from base_experiment (or other top-level configs) can be overwritten here
callbacks:
  eval_callback:
    eval_freq: 1000000000000000000000000000000

task_name: exp8_nf_i_d_1_r_1
model:
  unet:
    custome_unet_flag: True
    remove_downsample_blocks: [1] 
    remove_resnet_blocks: [1]
    loss_intermediate_output_flag: True 
    loss_final_output_flag: False
    # this is now in the up block
    down_block_int_loss: [5] # which features of the intermediate layers should be used for loss computation
    res_block_int_loss: [0] # should be features from a block further appart